<div class="answers-section mt-4 border rounded-lg p-4 bg-white shadow-sm">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-medium">Réponses pour la question: {{ questionText }}</h3>
    <button
      (click)="closeAnswers()"
      class="px-3 py-1 bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors"
    >
      Fermer
    </button>
  </div>
  <table class="w-full border-collapse">
    <thead>
    <tr class="bg-gray-50">
      <th class="text-left p-2 border-b">ID</th>
      <th class="text-left p-2 border-b">Réponse</th>
      <th class="text-left p-2 border-b">selectionCount</th>
    </tr>
    </thead>
    <tbody>
      @for ( answer of answers ; track answer.id){
    <app-answer-item

      [answer]="answer"
    ></app-answer-item>
      }

    </tbody>
  </table>
</div>
